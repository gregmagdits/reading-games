<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shooting Words</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/settings.css">
    <link rel="stylesheet" href="styles/effects.css">
  </head>
  <body>
    <main id="arena" class="arena" aria-label="Shooting words game">
      <div class="scene-visual" aria-hidden="true"></div>
      <div id="wordLayer" class="word-layer"></div>
      <div id="projectileLayer" class="projectile-layer"></div>
      <canvas id="fireworksCanvas" class="fireworks-canvas" aria-hidden="true"></canvas>
      <div id="pauseOverlay" class="pause-overlay" hidden>
        <div class="pause-message">paused</div>
      </div>

      <button id="soundButton" class="sound-button" type="button" aria-label="Hear the word again" hidden>🔊</button>

      <div id="shooterPicker" class="shooter-picker shooter-card-grid" aria-label="Choose shooter" hidden></div>

      <div id="gun" class="gun" aria-hidden="true"></div>

      <div id="startScreen" class="start-screen">
        <button id="startButton" class="start-button" type="button" disabled>Start</button>
      </div>

      <div id="error" class="error" role="alert" hidden></div>
      <div id="noMatchingWords" class="match-message" hidden>
        <div class="match-message-text">No Matching Words</div>
      </div>

      <button id="settingsToggle" class="settings-toggle" type="button" aria-label="Open settings">⚙</button>

      <aside id="settingsPanel" class="settings-panel" aria-label="Game settings" aria-hidden="true">
        <form id="passwordForm" class="settings-form">
          <h2 class="settings-title">Settings</h2>
          <label class="field">
            Password
            <input id="settingsPassword" type="password" autocomplete="current-password">
          </label>
          <div id="passwordStatus" class="settings-status" aria-live="polite"></div>
        </form>

        <form id="settingsForm" class="settings-form" hidden>
          <h2 class="settings-title">Word Data</h2>
          <div class="settings-actions">
            <button id="fullscreenSettingsButton" class="settings-action" type="button">Full screen settings</button>
          </div>
          <div class="settings-actions">
            <button id="importButton" class="settings-action" type="button">Import data</button>
            <button id="clearDatabaseButton" class="settings-action danger" type="button">Clear database</button>
          </div>
          <input id="importFileInput" type="file" accept=".csv,text/csv" hidden>

          <section class="settings-section" aria-labelledby="metricsSettingsTitle">
            <h3 id="metricsSettingsTitle" class="settings-section-title">Metrics</h3>
            <div class="settings-actions">
              <button id="importMetricsButton" class="settings-action" type="button">Import metrics</button>
              <button id="exportMetricsButton" class="settings-action" type="button">Export metrics</button>
              <button id="showMetricsButton" class="settings-action" type="button">Show metrics</button>
              <button id="clearMetricsButton" class="settings-action danger" type="button">Clear metrics</button>
            </div>
            <input id="importMetricsFileInput" type="file" accept=".csv,text/csv" hidden>
            <div id="metricsChartPanel" class="metrics-chart-panel" hidden>
              <p class="metrics-chart-note">Percent labels show percent correct.</p>
              <div id="metricsChartOutput"></div>
            </div>
          </section>

          <section class="settings-section" aria-labelledby="sourceSettingsTitle">
            <h3 id="sourceSettingsTitle" class="settings-section-title">Source</h3>
            <div id="sourceOptions" class="radio-group source-options"></div>
          </section>

          <section class="settings-section" aria-labelledby="presetsSettingsTitle">
            <h3 id="presetsSettingsTitle" class="settings-section-title">Presets</h3>
            <div id="presetOptions" class="preset-options"></div>
          </section>

          <div id="confirmClear" class="confirm-clear" hidden>
            <div>Are you sure you want to clear the data?</div>
            <div class="settings-actions">
              <button id="confirmClearYes" class="settings-action danger" type="button">Yes</button>
              <button id="confirmClearCancel" class="settings-action" type="button">Cancel</button>
            </div>
          </div>

          <div id="bookFilterControls" class="filter-controls">
            <label class="field">
              Section(s)
              <select id="sectionSelect" multiple disabled></select>
            </label>

            <label class="field">
              Lesson(s)
              <select id="lessonSelect" multiple disabled></select>
            </label>
          </div>

          <div id="posterFilterControls" class="filter-controls" hidden>
            <label class="field">
              Phoneme(s)
              <select id="phonemeSelect" multiple disabled></select>
            </label>

            <label class="field">
              letter_combination(s)
              <select id="letterCombinationSelect" multiple disabled></select>
            </label>
          </div>

          <fieldset class="radio-group">
            <legend>Capitalization</legend>
            <label class="radio-option">
              <input type="radio" name="capitalization" value="uppercase" checked>
              Uppercase
            </label>
            <label class="radio-option">
              <input type="radio" name="capitalization" value="lowercase">
              Lowercase
            </label>
            <label class="radio-option">
              <input type="radio" name="capitalization" value="original">
              As written
            </label>
          </fieldset>

          <div class="prefix-range" role="group" aria-label="Prefix length range">
            <label class="field">
              Min prefix length
              <input id="minPrefixLengthInput" type="number" min="0" step="1" value="1">
            </label>
            <label class="field">
              Max prefix length
              <input id="maxPrefixLengthInput" type="number" min="0" step="1" value="1">
            </label>
          </div>

          <div class="word-text-filters" role="group" aria-label="Word text filters">
            <label class="field">
              prefix
              <input id="wordFilterPrefixInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
            </label>
            <label class="field">
              suffix
              <input id="wordFilterSuffixInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
            </label>
          </div>

          <section class="settings-section" aria-labelledby="shooterSettingsTitle">
            <h3 id="shooterSettingsTitle" class="settings-section-title">Shooter</h3>
            <div id="shooterSettingsChoices" class="shooter-card-grid settings-shooter-grid"></div>
          </section>

          <section class="settings-section" aria-labelledby="shooterVisibilityTitle">
            <h3 id="shooterVisibilityTitle" class="settings-section-title">Shooter visibility during gameplay</h3>
            <div id="shooterVisibilityChoices" class="shooter-card-grid settings-shooter-grid"></div>
          </section>

          <div class="speed-control">
            <div class="speed-title">Word speed</div>
            <div class="speed-gauge" aria-hidden="true">
              <div class="speed-arc"></div>
              <div id="speedNeedle" class="speed-needle"></div>
              <div class="speed-labels">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
              </div>
            </div>
            <input id="speedControl" class="speed-range" type="range" min="1" max="5" step="1" value="5" aria-label="Word speed">
            <div id="speedValue" class="speed-value">Speed 5</div>
          </div>

          <div class="settings-actions">
            <button id="applySettingsButton" class="settings-action primary" type="submit" disabled>Apply</button>
            <button id="cancelSettingsButton" class="settings-action" type="button">Cancel</button>
          </div>
          <div id="settingsStatus" class="settings-status" aria-live="polite"></div>
        </form>
      </aside>
    </main>

    <script type="module" src="js/app.mjs"></script>
  </body>
</html>
